name: smartvoucher-production

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER to a non-root user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    image: smartvoucher-backend:local
    env_file: .env.backend
    environment:
      DJANGO_SETTINGS_MODULE: smartvoucher.settings
      DJANGO_ENV: production
      DB_ENGINE: django.db.backends.mysql
      DB_HOST: db
      DB_PORT: "3306"
      CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      CACHE_LOCATION: redis://redis:6379/1
      RUN_MAIN: "false"
      ENABLE_VOUCHER_SCHEDULER: "false"
    restart: unless-stopped
    command: >-
      sh -c 'python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec env ENABLE_VOUCHER_SCHEDULER=true
      gunicorn smartvoucher.wsgi:application --bind 0.0.0.0:8000
      --workers 1 --access-logfile - --error-logfile -'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
