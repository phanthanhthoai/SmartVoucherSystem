services:
  redis:
    image: redis:7-alpine
    container_name: smartvoucher_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: mysql:8.0
    container_name: smartvoucher_mysql
    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  web:
    build: .

    container_name: smartvoucher_django
    restart: always

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    volumes:
      - .:/app
      - media_data:/app/media

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      CACHE_LOCATION: redis://redis:6379/1

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/vouchers/stats/overview/public/', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  scheduler:
    build: .
    container_name: smartvoucher_scheduler
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py run_voucher_scheduler"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      CACHE_BACKEND: django.core.cache.backends.redis.RedisCache
      CACHE_LOCATION: redis://redis:6379/1
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  mysql_data:
  redis_data:
  media_data: